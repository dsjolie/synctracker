# The GitHub Pages site: the about page from site/ at the root, and the player at /player/
# with the CC0 demo tracks as its library (player/mods/).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site/player/mods
          cp site/index.html _site/
          cp -r site/screenshots _site/
          cp index.html *.js _site/player/
          cp -r vendor _site/player/
          cp site/demo/* _site/player/mods/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
